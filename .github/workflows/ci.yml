name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Display Swift Version
        run: swift --version

      - name: Build and Test
        run: swift test
