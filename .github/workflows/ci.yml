name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Display Swift Version
        run: swift --version

      - name: Build and Test
        run: swift test
